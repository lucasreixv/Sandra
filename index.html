<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Signo</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body id="calcuSig">
    <form id="formSig">
        <h1>CALCULADORA DE SIGNO</h1>
        <br><br/>

        <label for="dia">Informe o dia do seu nascimento: </label>
        <input type="text" name="dia" id="dia"/>
        <br/>

        <label for="mes">Informe o mês do seu nascimento: </label>
        <input type="text" name="mes" id="mes"/>
        <br/>
        
        <label for="ano">Informe o ano do seu nascimento: </label>
        <input type="text" name="ano" id="ano"/>
        <br/><br>

        <label for="Idade">Sua idade é: </label>
        <input type="text" id="Idade" readonly/>
        <br/>
        
        <label for="mesnas">Seu mês de nascimento foi: </label>
        <input type="text" id="mesnas" readonly/>
        <br/>
        
        <label for="txtsema">O dia da semana foi: </label>
        <input type="text" id="txtsema" readonly/>
        <br/><br>
        
        <div id="mensagem" style="visibility: hidden;"> </div>
        <br/>

        <div>
            <label>Seu signo:</label>
            <span id="nomeSigno"></span>
            <img src="" name="signo" id="imgSigno" alt="">
        </div>

        <br/>
        <input type="button" value="Calcular" onclick="Calcular()">
        <input type="reset" value="Limpar" onclick="limpar()">

    </form>

    <script src="./src/js/script.js"></script>
</body>
</html>
